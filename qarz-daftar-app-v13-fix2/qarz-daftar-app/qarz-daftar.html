<title>Qarzim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF5EE; --bg2:#F5ECE0;
  --coral:#FF6B47; --coral2:#FF8F6B; --teal:#0F8C7C; --teal2:#14B8A6; --amber:#FFB020; --violet:#8B7CF6;
  --surface: rgba(255,255,255,0.82);
  --surface2: rgba(36,28,24,0.045);
  --border: rgba(36,28,24,0.08);
  --border-hi: rgba(36,28,24,0.14);
  --text:#241C18; --text-dim:#75675E; --text-faint:#A79A8F;
  --danger:#E4472F; --danger-soft:rgba(228,71,47,0.1);
  --success:#0F8C7C; --success-soft:rgba(15,140,124,0.1);
  --grad-main: linear-gradient(135deg, var(--coral), var(--amber));
  --grad-teal: linear-gradient(135deg, var(--teal2), var(--teal));
  --shadow: 0 24px 60px -28px rgba(36,28,24,0.22);
  --radius: 22px;
  --tabbar-h: 70px;
  color-scheme: light;
}
html[data-theme="dark"]{
  --bg:#1A1512; --bg2:#211A16;
  --surface: rgba(255,247,240,0.06);
  --surface2: rgba(255,247,240,0.055);
  --border: rgba(255,247,240,0.1);
  --border-hi: rgba(255,247,240,0.18);
  --text:#FBF3EC; --text-dim:#C9BAAF; --text-faint:#8D7E74;
  --shadow: 0 24px 60px -24px rgba(0,0,0,0.55);
  color-scheme: dark;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color: transparent;}
html,body{ overscroll-behavior-y: none; }
body{
  font-family:'Plus Jakarta Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height:100vh;
  overflow-x:hidden;
  transition: background .5s ease, color .5s ease;
}
.disp{ font-family:'Space Grotesk', sans-serif; }
.mono{ font-family:'JetBrains Mono', monospace; }

.aurora{ position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
.aurora .blob{ position:absolute; border-radius:50%; filter: blur(100px); opacity:.35; }
.aurora .b1{ width:600px; height:600px; background: radial-gradient(circle, var(--coral2), transparent 70%); top:-200px; left:-160px; animation: drift1 26s ease-in-out infinite; }
.aurora .b2{ width:480px; height:480px; background: radial-gradient(circle, var(--teal2), transparent 70%); bottom:-180px; right:-140px; animation: drift2 30s ease-in-out infinite; }
.aurora .b3{ width:360px; height:360px; background: radial-gradient(circle, var(--amber), transparent 70%); top:38%; right:6%; opacity:.22; animation: drift1 34s ease-in-out infinite reverse; }
html[data-theme="dark"] .aurora .blob{ opacity:.16; }
@keyframes drift1{ 0%,100%{ transform: translate(0,0) scale(1);} 50%{ transform: translate(60px,45px) scale(1.1);} }
@keyframes drift2{ 0%,100%{ transform: translate(0,0) scale(1);} 50%{ transform: translate(-55px,-35px) scale(1.08);} }
@media (prefers-reduced-motion: reduce){ .aurora .blob{animation:none;} }

#app{ position:relative; z-index:2; min-height:100vh; }

.card{
  background: var(--surface);
  border:1px solid var(--border);

/* ===== toast ===== */
.toast-wrap{ position:fixed; top:calc(14px + env(safe-area-inset-top, 0px)); left:50%; transform:translateX(-50%); z-index:100; display:flex; flex-direction:column; gap:8px; align-items:center; width:min(92vw,380px); }
.toast{ padding:12px 18px; border-radius:14px; font-size:13px; font-weight:600; box-shadow:var(--shadow); animation: toastIn .35s cubic-bezier(.16,1,.3,1), toastOut .3s ease 2.4s forwards; display:flex; align-items:center; gap:9px; background:var(--surface); border:1px solid var(--border); backdrop-filter:blur(18px); color:var(--text); width:100%; }

@keyframes toastOut{ to{opacity:0; transform:translateY(-16px);} }

}

/* ---------- Pul harakati (Hisobot → Boshqaruv) ---------- */

function fmt(n){ n = Math.round(n||0); return n.toLocaleString('uz-UZ').replace(/,/g,' '); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayStr(){ const d=new Date(); return d.toLocaleDateString('uz-UZ',{day:'2-digit',month:'2-digit',year:'numeric'})+' • '+d.toLocaleTimeString('uz-UZ',{hour:'2-digit',minute:'2-digit'}); }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDate(iso){ if(!iso) return ''; const d = new Date(iso+'T00:00:00'); return d.getDate()+'-'+UZ_MONTHS[d.getMonth()]+', '+d.getFullYear(); }
function daysOverdue(iso){ const d = new Date(iso+'T00:00:00'); const now = new Date(todayISO()+'T00:00:00'); return Math.round((now-d)/86400000); }
function initials(name){ return (name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function balanceOf(c){ return (c.transactions||[]).reduce((s,t)=> s + (t.type==='debt'? t.amount : -t.amount), 0); }
function isOverdue(c){ return balanceOf(c) > 0 && c.dueDate && c.dueDate < todayISO(); }
/* mijoz faolligi: 1 kun kechiksa hali faol (yashil), 2 kun - sariq, 3 va undan ko'p - qizil (faol emas) */
function lateLvl(c){ if(!(balanceOf(c)>0&&c.dueDate)) return null; const d=daysOverdue(c.dueDate); return d<=1?'ok':d===2?'warn':'bad'; }
function latePill(c,center){ const lv=lateLvl(c); if(!lv) return ''; const d=daysOverdue(c.dueDate);
  const dd='muddat: '+fmtDate(c.dueDate)+' \u00b7 ';const txt=d<=0?('muddat: '+fmtDate(c.dueDate)):d===1?dd+'1 kun kechikdi \u00b7 faol mijoz':d===2?dd+'2 kun kechikdi \u00b7 diqqat':(dd+d+' kun kechikdi \u00b7 faol emas');
  return '<div class="due-pill lv lv-'+lv+'"'+(center?' style="justify-content:center;margin-top:8px"':'')+'><i class="lv-dot"></i>'+txt+'</div>'; }
function lateTag(c){ const lv=lateLvl(c); if(!lv||daysOverdue(c.dueDate)<1) return null; return {cls:'tag lv-tag lv-'+lv,txt:lv==='ok'?'faol':lv==='warn'?'diqqat':'faol emas'}; }

  return 'https://wa.me/'+digits+'?text='+encodeURIComponent(msg);
}

const AVATAR_GRADS = [
  ['#FF6B47','#FFB020'], ['#8B7CF6','#FF6B47'], ['#14B8A6','#0F8C7C'],
  ['#FFB020','#FF8F6B'], ['#0F8C7C','#14B8A6'], ['#8B7CF6','#14B8A6'], ['#FF6B47','#8B7CF6']
];
function avatarGrad(name){ return 'var(--ink)';
  let h=0; for(let i=0;i<(name||'').length;i++) h = (name.charCodeAt(i) + ((h<<5)-h))|0;
  const g = AVATAR_GRADS[Math.abs(h) % AVATAR_GRADS.length];
  return 'linear-gradient(135deg,'+g[0]+','+g[1]+')';
}

function ripple(e, el){
  const rect = el.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  const span = document.createElement('span');
  span.className='ripple-el';
  span.style.width = span.style.height = size+'px';
  span.style.left = ((e.clientX ?? rect.left+rect.width/2) - rect.left - size/2)+'px';
  span.style.top = ((e.clientY ?? rect.top+rect.height/2) - rect.top - size/2)+'px';
  el.appendChild(span);
  setTimeout(()=>span.remove(), 650);
}
document.addEventListener('click', (e)=>{
  const el = e.target.closest('.btn, .calc-btn, .fab, .bt-item');
  if(el) ripple(e, el);
});

function countUp(el, target, duration){
  duration = duration || 750;
  let startTime=null;
  function step(ts){
    if(!startTime) startTime=ts;
    const p = Math.min((ts-startTime)/duration, 1);
    const eased = 1-Math.pow(1-p,3);
    el.textContent = fmt(target*eased);
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

  wrap.appendChild(el);
  setTimeout(()=> el.remove(), 2800);
}

function bindAuth(){
  document.getElementById('toRegister')?.addEventListener('click', ()=>{ authMode='register'; render(); });
  document.getElementById('toLogin')?.addEventListener('click', ()=>{ authMode='login'; render(); });
  document.getElementById('eyeToggle')?.addEventListener('click', ()=>{
    pwVisible = !pwVisible;
    const pw = document.getElementById('authPass');
    const curVal = pw.value;
    pw.type = pwVisible ? 'text' : 'password';
    pw.value = curVal;
    document.getElementById('eyeToggle').innerHTML = pwVisible ? ic.eyeOff : ic.eye;
    pw.focus();
  });
  document.getElementById('authForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const btn = document.getElementById('authSubmit');
    const unameRaw = document.getElementById('authUser').value.trim();
    const pass = document.getElementById('authPass').value;
    const errEl = document.getElementById('authErr');
    errEl.style.display='none';
    if(!unameRaw || !pass){ errEl.textContent='Barcha maydonlarni toʻldiring'; errEl.style.display='block'; return; }
    if(pass.length < 4){ errEl.textContent="Parol kamida 4 ta belgidan iborat bo'lsin"; errEl.style.display='block'; return; }
    const userKey = normUser(unameRaw);
    if(!userKey){ errEl.textContent="Foydalanuvchi nomi noto'g'ri"; errEl.style.display='block'; return; }
    btn.disabled = true;
    const origLabel = btn.textContent;
    btn.innerHTML = '<span class="spin"></span>';
    const restore = ()=>{ btn.disabled=false; btn.textContent = origLabel; };
    const users = getUsers();
    if(authMode==='register'){
      if(users.find(u=>u.key===userKey)){
        errEl.textContent='Bu nom band. Boshqa nom tanlang.'; errEl.style.display='block'; restore(); return;
      }
      users.push({key:userKey, username:unameRaw, ph:hash(pass), createdAt:Date.now()});
      if(!saveUsers(users)){ errEl.textContent="Saqlashda xatolik. Qaytadan urinib ko'ring."; errEl.style.display='block'; restore(); return; }
      S.user = unameRaw; S.userKey = userKey;
      const shop = loadShopData(userKey); S.clients = shop.clients; S.lenders = shop.lenders;
      toast('Hisob yaratildi. Xush kelibsiz!');
      render();
    } else {
      const u = users.find(u=>u.key===userKey);
      if(!u || !checkLocalPass(u,pass)){ errEl.textContent="Login yoki parol noto'g'ri"; errEl.style.display='block'; restore(); return; }
      S.user = u.username; S.userKey = userKey;
      const shop = loadShopData(userKey); S.clients = shop.clients; S.lenders = shop.lenders;
      render();
      const overdueCount = S.clients.filter(isOverdue).length + S.lenders.filter(isOverdue).length;
      if(overdueCount > 0) setTimeout(()=> toast(overdueCount+" ta muddati o'tgan qarz bor", false), 400);
    }
  });
}

function filteredSortedList(kind){
  const raw = S.search[kind]||'', search = raw.toLowerCase(), digits = raw.replace(/\D/g,'');
  const adv = (S.adv&&S.adv[kind]) || {};
  const mn = (adv.min!==''&&adv.min!=null) ? +adv.min : null, mx = (adv.max!==''&&adv.max!=null) ? +adv.max : null;
  let list = S[kind].filter(c => (c.name||'').toLowerCase().includes(search) || (digits && (c.phone||'').replace(/\D/g,'').includes(digits)));
  if(S.filterBy[kind]==='debt') list = list.filter(c=> balanceOf(c) > 0);
  else if(S.filterBy[kind]==='paid') list = list.filter(c=> balanceOf(c) <= 0);
  else if(S.filterBy[kind]==='overdue') list = list.filter(isOverdue);
  if(mn!=null) list = list.filter(c=> Math.abs(balanceOf(c)) >= mn);
  if(mx!=null) list = list.filter(c=> Math.abs(balanceOf(c)) <= mx);
  if(adv.from||adv.to) list = list.filter(c=>{ const last=(c.transactions||[]).reduce((m,t)=>Math.max(m,t.ts||0),0); if(!last) return false; const d=qdDay(last); return (!adv.from||d>=adv.from)&&(!adv.to||d<=adv.to); });
  if(S.sortBy[kind]==='debt') list = list.slice().sort((a,b)=> (isOverdue(b)-isOverdue(a)) || (balanceOf(b) - balanceOf(a)));
  else if(S.sortBy[kind]==='due') list = list.slice().sort((a,b)=> (balanceOf(a)>0?0:1)-(balanceOf(b)>0?0:1) || (a.dueDate?0:1)-(b.dueDate?0:1) || String(a.dueDate||'').localeCompare(String(b.dueDate||'')));
  else list = list.slice().sort((a,b)=> a.name.localeCompare(b.name));
  return list;
}

/* ===================== REPORT VIEW ===================== */
function computeMonthly(kind, monthsBack){
  monthsBack = monthsBack || 6;
  const map = {};
  S[kind].forEach(c=> (c.transactions||[]).forEach(t=>{
    const d = new Date(t.ts || Date.now());
    const key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    if(!map[key]) map[key] = {debt:0, pay:0};
    if(t.type==='debt') map[key].debt += t.amount; else map[key].pay += t.amount;
  }));
  const now = new Date();
  const keys = [];
  for(let i=monthsBack-1;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    keys.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));
  }
  return keys.map(k=>{
    const [y,m] = k.split('-').map(Number);
    const v = map[k] || {debt:0,pay:0};
    return { key:k, label: ['Yan','Fev','Mar','Apr','May','Iyn','Iyl','Avg','Sen','Okt','Noy','Dek'][m-1]+' '+String(y).slice(2), fullLabel: UZ_MONTHS[m-1]+' '+y, debt:v.debt, pay:v.pay, net: v.debt-v.pay };
  });
}

    + '<button class="calc-btn" data-k="1">1</button><button class="calc-btn" data-k="2">2</button><button class="calc-btn" data-k="3">3</button><button class="calc-btn op" data-k="+">+</button>'

function calcPress(k){
  const c = S.calc;
  const isDigit = /^[0-9]$/.test(k);
  if(isDigit){ if(c.cur==='0'||c.reset){ c.cur = k; c.reset=false; } else if(c.cur.length<15){ c.cur += k; } }
  else if(k==='.'){ if(c.reset){ c.cur='0'; c.reset=false; } if(!c.cur.includes('.')) c.cur += '.'; }
  else if(k==='clear'){ c.cur='0'; c.prev=''; c.op=null; c.reset=false; }
  else if(k==='neg'){ c.cur = (parseFloat(c.cur||'0') * -1).toString(); }
  else if(k==='percent'){ c.cur = (parseFloat(c.cur||'0') / 100).toString(); }
  else if(['÷','×','−','+'].includes(k)){ if(c.op && !c.reset){ compute(); } c.prev = c.cur + ' ' + k; c.op = k; c.reset = true; }
  else if(k==='='){ if(c.op){ compute(true); c.op=null; } }
  const pe=document.getElementById('cPrev'),ce=document.getElementById('cCur');if(pe)pe.textContent=c.prev;if(ce)ce.textContent=c.cur;
}
function compute(final){
  const c = S.calc;
  const a = parseFloat((c.prev||'').split(' ')[0]);
  const b = parseFloat(c.cur);
  if(isNaN(a) || isNaN(b)) return;
  let r;
  switch(c.op){ case '÷': r = b===0 ? NaN : a/b; break; case '×': r = a*b; break; case '−': r = a-b; break; case '+': r = a+b; break; }
  c.cur = isNaN(r) ? 'Xato' : (Math.round(r*100000)/100000).toString();
  c.prev = final ? (a+' '+c.op+' '+b+' =') : '';
  c.reset = true;
}

function itemsOf(c){const seen=[];(c.transactions||[]).slice().reverse().forEach(t=>{if(t.type==='debt'&&t.note){const n=String(t.note).trim();if(n&&!/^(qarz|boshlang)/i.test(n)&&!seen.includes(n)&&seen.length<3)seen.push(n);}});return seen.join(', ').slice(0,70);}
function promiseState(c){if(!(balanceOf(c)>0)||!c.promiseDate)return null;const td=todayStr().slice(0,10);if(c.promiseDate>td)return 'wait';if(c.promiseDate===td)return 'today';return 'broken';}
function goodsHtml(c){if(S.activeKind!=='clients')return '';return '<button type="button" id="goodsBtn" class="goods-btn">+ Tovar yozish (olingan yuk)</button>';}
function promiseHtml(c){if(S.activeKind!=='clients'||!(balanceOf(c)>0))return '';const st=promiseState(c);const d=c.promiseDate?fmtDate(c.promiseDate):'';
  const lab=!st?'+ To\u2018lov sanasi (va\u2019da)':st==='wait'?'Va\u2019da: '+d:st==='today'?'Bugun to\u2018lash kuni':'Va\u2019da buzildi ('+d+')';
  return '<button type="button" id="promBtn" class="prom-pill '+(st||'none')+'">'+lab+'</button>';}
function txChips(m){
  if((m||S.txMode)==='debt')return '';
  if(1)return ['Naqd','Karta'].map(x=>'<button type="button" class="txchip" data-chip="'+x+'">'+x+'</button>').join('');
  const seen=[],all=[];(S.clients||[]).forEach(c=>(c.transactions||[]).forEach(t=>{if(t.type==='debt'&&t.note)all.push(t);}));
  all.sort((a,b)=>(b.ts||0)-(a.ts||0));all.forEach(t=>{const n=t.note.trim();if(n&&n.length<=28&&!seen.includes(n)&&seen.length<6)seen.push(n);});
  return seen.map(x=>'<button type="button" class="txchip" data-chip="'+escapeHtml(x)+'">'+escapeHtml(x)+'</button>').join('');
}

function animateOverview(kind){
  const list = S[kind];
  let borrow=0, repaid=0, rem=0;
  list.forEach(c=>{ let b=0; (c.transactions||[]).forEach(t=>{ const a=+t.amount||0; if(t.type==='debt'){ borrow+=a; b+=a; } else { repaid+=a; b-=a; } }); if(b>0) rem+=b; });
  const cleanCount = list.filter(c=> balanceOf(c) <= 0).length;
  const pct = list.length ? Math.round(cleanCount / list.length * 100) : 0;
  const circumference = 2 * Math.PI * 44;
  const ringFg = document.getElementById('ringFg');
  requestAnimationFrame(()=>{ if(ringFg) ringFg.style.strokeDashoffset = (circumference - (pct/100)*circumference); });
  const bEl = document.getElementById('statBorrow'), rEl = document.getElementById('statRepaid'), mEl = document.getElementById('statRem'), cEl = document.getElementById('statCount');
  if(bEl) countUp(bEl, borrow); if(rEl) countUp(rEl, repaid); if(mEl) countUp(mEl, rem); if(cEl) countUp(cEl, list.length, 450);
}

function burstCelebrate(){
  const cvs = document.getElementById('burstCanvas');
  const ctx = cvs.getContext('2d');
  cvs.width = innerWidth; cvs.height = innerHeight; cvs.style.display='block';
  const colors = ['#8a8a8a','#bdbdbd','#ffffff','#4a4a4a','#111111'];
  const particles = Array.from({length:46}, ()=>({
    x: innerWidth/2, y: innerHeight*0.3,
    vx: (Math.random()-0.5)*12, vy: -Math.random()*10-2,
    size: 5+Math.random()*7, life:1, color: colors[Math.floor(Math.random()*colors.length)]
  }));
  function step(){
    ctx.clearRect(0,0,cvs.width,cvs.height);
    let alive=false;
    particles.forEach(p=>{
      if(p.life<=0) return; alive=true;
      p.vy += 0.32; p.x += p.vx; p.y += p.vy; p.life -= 0.014;
      ctx.globalAlpha = Math.max(p.life,0);
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fillStyle=p.color; ctx.fill();
    });
    ctx.globalAlpha=1;
    if(alive) requestAnimationFrame(step); else cvs.style.display='none';
  }
  step();
}

  const raw=storageGet('shop_'+skey(userKey));let p={};try{p=raw?JSON.parse(raw):{};}catch(e){}
  const r={clients:p.clients||[],lenders:p.lenders||[]};
  const keep=S.clients,kl=S.lenders;S.clients=r.clients;S.lenders=r.lenders;SNAPIDS=ids();SNAPJ=snapJ();S.clients=keep;S.lenders=kl;
  return r;
};
function tombs(){try{return JSON.parse(storageGet('tomb_'+skey(S.userKey))||'[]');}catch(e){return [];}}
window.saveShopData=function(){
  const now=Date.now(),cur=ids(),tb=tombs(),dead=t=>!t.r||t.r<t.t,tset={};tb.forEach(t=>{if(dead(t))tset[t.id]=1;});
  Object.keys(SNAPIDS).forEach(id=>{if(!cur[id]){const e=tb.find(t=>t.id===id);if(!e)tb.push({id:id,t:now});else if(!dead(e))e.t=now;}});
  tb.forEach(t=>{if(cur[t.id]&&dead(t))t.r=now+1;});
  ['clients','lenders'].forEach(k=>S[k].forEach(c=>{
    (c.transactions||[]).forEach(t=>{if(!t.by&&t.ts&&t.ts>now-6000)t.by=S.user;if(!t.cur)t.cur=curOf(c);});
    const x=Object.assign({},c);delete x._m;delete x.transactions;const j=JSON.stringify(x);if(SNAPJ[c.id]!==j||!c._m){c._m=now;}
  }));
  const ok=storageSet('shop_'+skey(S.userKey),JSON.stringify({clients:S.clients,lenders:S.lenders}));
  if(!ok){toast("Saqlashda xatolik yuz berdi",false);return false;}
  storageSet('tomb_'+skey(S.userKey),JSON.stringify(tb.slice(-3000)));
  SNAPIDS=ids();SNAPJ=snapJ();cloudKick();return true;
};

/* ---------- CLOUD (Firebase Realtime Database REST) ---------- */
function curl(){return (storageGet('cloud_url')||'').replace(/\/+$/,'');}
let CST='off',busy=false,tmr=null;
function setSt(s){CST=s;const b=$('#cloudRow');if(b)b.textContent=cloudLabel();}
function cloudLabel(){return '☁️ Bulutga saqlash'+(curl()?(CST==='ok'?' — ulangan':CST==='err'?' — xatolik':' — ulanmoqda'):' — o‘chiq');}
function isSrv(){return /\/api\/cloud$/.test(curl());}
function qhead(extra){const h=Object.assign({},extra||{});if(!isSrv())return h;let a=window.__qdAuth;if(a===undefined){const u=allUsers().find(x=>x.key===S.userKey);a=u?{u:u.key,a:phOf(u)}:null;}if(a){h['X-Qd-User']=a.u;h['X-Qd-Auth']=a.a;}return h;}
async function cget(p){const r=await fetch(curl()+'/'+p+'.json',{cache:'no-store',headers:qhead()});if(!r.ok){const e=new Error(r.status);e.status=r.status;throw e;}return r.json();}
async function cput(p,v){const r=await fetch(curl()+'/'+p+'.json',{method:'PUT',headers:qhead({'Content-Type':'application/json'}),body:JSON.stringify(v)});if(!r.ok){const e=new Error(r.status);e.status=r.status;e.body=await r.json().catch(()=>null);throw e;}}
let LASTPUSH='',IDXOK={};
async function ensureIdx(){if(!isSrv())return;const me=allUsers().find(x=>x.key===S.userKey);if(!me)return;const ok=skey(S.userKey);
  const order=[me].concat(allUsers().filter(u=>u.key!==me.key&&skey(u.key)===ok&&(me.owner?false:true)));
  for(const u of order){const sig=u.key+'|'+phOf(u)+'|'+(u.role||'');if(IDXOK[sig])continue;try{await cput('qd_idx/'+u.key,idxBody(u));IDXOK[sig]=1;}catch(e){if(u===me)throw e;}}}
function mergeItems(loc,rem,tset){
  const m={};loc.forEach(c=>m[c.id]=c);
  rem.forEach(r=>{ if(tset[r.id])return; const l=m[r.id]; if(!l){m[r.id]=r;return;}
    const base=((r._m||0)>(l._m||0))?r:l, other=base===r?l:r, tx={};
    (l.transactions||[]).concat(r.transactions||[]).forEach(t=>{if(!tset[t.id])tx[t.id]=t;});
    const o=Object.assign({},base);o.transactions=Object.values(tx).sort((a,b)=>(a.ts||0)-(b.ts||0));m[r.id]=o; });
  Object.keys(m).forEach(id=>{if(tset[id])delete m[id];else{m[id].transactions=(m[id].transactions||[]).filter(t=>!tset[t.id]);}});
  return Object.values(m);
}
/* v11: omborda yetmagan sotuvlar. Server butun yozuvni rad etadi (409); faqat zaxirasi yetmagan
   sotuvlar (yangi yoki o‘zgargan) ajratiladi va "saqlanmagan" ro‘yxatiga o‘tadi. Qolgan o‘zgarishlar yuboriladi. */
const pushBody=(tb)=>({ts:Date.now(),clients:S.clients,lenders:S.lenders,del:Object.values(tb)});
const pushKey=(tb)=>JSON.stringify([S.clients,S.lenders,Object.values(tb)]);
function rejList(ok){try{return JSON.parse(storageGet('v11rej_'+ok)||'[]');}catch(e){return [];}}
function quarantineSales(ok,rem,lines){
  const bad=new Set((lines||[]).map(l=>l&&l.productId).filter(Boolean));
  if(!bad.size)return 0;
  const srv={};(rem.clients||[]).forEach(c=>(c.transactions||[]).forEach(t=>{srv[t.id]=JSON.stringify(t);}));
  const list=[];
  S.clients.forEach(c=>{
    const out=[];
    (c.transactions||[]).forEach(t=>{
      const hit=(t.items||[]).some(it=>it&&bad.has(it.productId));
      const sv=srv[t.id];
      if(!hit||sv===JSON.stringify(t)){out.push(t);return;}
      list.push({id:t.id,clientId:c.id,clientName:c.name,tx:t,at:Date.now(),lines:(lines||[]).filter(l=>l&&bad.has(l.productId)).map(l=>({name:l.name,need:l.need,have:l.have,needOwner:!!l.needOwner}))});
      if(sv)out.push(JSON.parse(sv));
    });
    c.transactions=out;
  });
  if(list.length){storageSet('v11rej_'+ok,JSON.stringify(rejList(ok).concat(list).slice(-200)));saveShopData();}
  return list.length;
}
async function pushWithRecovery(ok,tb,rem){
  try{await cput('qd/'+ok,pushBody(tb));LASTPUSH=pushKey(tb);return;}
  catch(e){
    const j=e.body||{};
    if(e.status===403){toast('Bu o‘zgarish uchun ruxsatingiz yo‘q',false);LASTPUSH=pushKey(tb);return;}
    if(!(e.status===409&&j.error==='stock_insufficient'))throw e;
    const n=quarantineSales(ok,rem,j.lines);
    if(!n){toast('Omborda yetarli tovar yo‘q — yozuv saqlanmadi',false);LASTPUSH=pushKey(tb);return;}
    toast(n+' ta sotuv saqlanmadi: omborda yetarli tovar yo‘q',false);
    await cput('qd/'+ok,pushBody(tb));
    LASTPUSH=pushKey(tb);
  }
}
async function cloudSync(){
  if(!curl()||!S.user||busy||S.demo)return;busy=true;
  try{
    const ok=skey(S.userKey);await ensureIdx();const rem=await cget('qd/'+ok)||{};
    const tb={};tombs().concat(rem.del||[]).forEach(t=>{const o=tb[t.id];if(!o||Math.max(t.r||0,t.t)>Math.max(o.r||0,o.t))tb[t.id]=t;});const tset={};Object.keys(tb).forEach(i=>{const t=tb[i];if(!t.r||t.r<t.t)tset[i]=1;});
    const before=JSON.stringify([S.clients,S.lenders]);
    S.clients=mergeItems(S.clients,rem.clients||[],tset);S.lenders=mergeItems(S.lenders,rem.lenders||[],tset);
    const changed=before!==JSON.stringify([S.clients,S.lenders]);
    storageSet('shop_'+ok,JSON.stringify({clients:S.clients,lenders:S.lenders}));storageSet('tomb_'+ok,JSON.stringify(Object.values(tb)));
    SNAPIDS=ids();SNAPJ=snapJ();
    const push=JSON.stringify([S.clients,S.lenders,Object.values(tb)]);
    if(push!==LASTPUSH){await pushWithRecovery(ok,tb,rem);}
    if(!isSrv()){const us=allUsers().filter(u=>skey(u.key)===ok);
    for(const u of us){await cput('qd_idx/'+u.key,idxBody(u));}}
    storageSet('cloud_last',String(Date.now()));
    setSt('ok');
    if(changed&&!document.querySelector('.overlay')&&!document.querySelector('#calcRoot.open')){try{refreshView();}catch(e){render();}}
  }catch(e){setSt('err');}
  busy=false;
}
function cloudKick(){if(!curl()||S.demo)return;clearTimeout(tmr);tmr=setTimeout(cloudSync,1200);}
setInterval(()=>{if(S.user&&curl())cloudSync();},20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.user&&curl())cloudSync();});
window.cloudSync=cloudSync;window.__qdx={qhead:qhead,isSrv:isSrv,hash:hash,cget:cget,curl:curl,me:me};
// v11 ko‘prigi: saqlanmagan sotuvlar va tovar ro‘yxati keshi (goods tanlovchi uchun)
window.__qdx.rej={
  list:()=>rejList(skey(S.userKey)),
  restore:(id,allowNeg)=>{const ok=skey(S.userKey),L=rejList(ok),it=L.find(x=>x.id===id);if(!it)return false;
    if(allowNeg)(it.tx.items||[]).forEach(i=>{if(i&&i.productId)i.allowNegative=true;});
    let c=S.clients.find(x=>x.id===it.clientId);if(!c){c={id:it.clientId,name:it.clientName,transactions:[]};S.clients.push(c);}
    c.transactions.push(it.tx);storageSet('v11rej_'+ok,JSON.stringify(L.filter(x=>x.id!==id)));saveShopData();cloudKick();return true;},
  discard:(id)=>{const ok=skey(S.userKey);storageSet('v11rej_'+ok,JSON.stringify(rejList(ok).filter(x=>x.id!==id)));return true;}
};
window.__qdx.products=[];
window.__qdx.demo=()=>!!S.demo;
window.__qdx.exitDemo=()=>{if(S.demo)qdExitDemo();};
(function(){const base=(window.QD_API_BASE||'')+'/api/cloud';if(location.protocol==='file:'&&!window.QD_API_BASE)return;
  fetch(base+'/ping',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(j&&j.cloud){const u=(window.QD_API_BASE||location.origin)+'/api/cloud';if(storageGet('cloud_url')!==u){storageSet('cloud_url',u);}if(S.user)cloudSync();}}).catch(()=>{});})();

function openCloud(){
  if(isSrv()){const lc=+storageGet('cloud_last')||0;const ov=modal(head('Bulutga saqlash')+'<div class="hint" style="margin:0 0 12px;line-height:1.55">Ma’lumotlaringiz xavfsiz serverda ham saqlanadi. Telefon yo‘qolsa yoki sinsa, boshqa telefondan <b>shu login va parol</b> bilan kirsangiz, hammasi qaytadi. Ikki telefondan bir vaqtda ishlasangiz ham o‘zgarishlar birlashadi.</div><div class="sms-note" id="cSt">Holat: '+(CST==='ok'?'ulangan':CST==='err'?'xatolik':'ulanmoqda')+(lc?' · oxirgi saqlash: '+new Date(lc).toLocaleString('uz-UZ'):'')+'</div><button class="btn btn-primary btn-block" id="cNow" type="button" style="margin-top:12px">Hozir saqlash</button>','cloudOv');

  $('#cOff',ov).onclick=()=>{storageSet('cloud_url','');CST='off';ov.remove();toast('Bulut o‘chirildi');};

    catch(e){m.textContent='Ulanmadi. Manzil yoki qoidalarni tekshiring.';}};
}

function switchTo(key){const u=allUsers().find(x=>x.key===key);if(!u||u.key===S.userKey)return;
  const go=()=>{saveShopData();storageSet('session',key);S.user=u.username;S.userKey=u.key;const sh=loadShopData(key);S.clients=sh.clients;S.lenders=sh.lenders;S.view='clients';S.activeKind='clients';storageSet('view','clients');document.querySelectorAll('.overlay').forEach(o=>o.remove());render();toast('\u201c'+u.username+'\u201d do‘koniga o‘tildi');};
  if(storageGet('pin_'+key))lockUI(key,go);else go();}
function addShop(){saveShopData();storageSet('session','');S.user=null;S.userKey=null;S.clients=[];S.lenders=[];S.view='clients';S.activeKind='clients';authMode='register';document.querySelectorAll('.overlay').forEach(o=>o.remove());render();}
function openShops(){
  const ov=modal(head('Do‘konlar')+'<div class="hint" style="margin:0 0 12px;line-height:1.55">Bir telefonda bir nechta do‘kon yuritishingiz mumkin. Har birining ma’lumoti alohida. Bosing, o‘sha do‘konga o‘tasiz.</div>'

   +'<button class="btn btn-primary btn-block" id="shopAdd" type="button" style="margin-top:12px">+ Yangi do‘kon qo‘shish</button>'
   +'<form id="shopForm" style="display:none;flex-direction:column;gap:8px;margin-top:12px"><div class="hint" style="margin:0">Yangi do‘kon uchun nom va parol tanlang. Hozirgi do‘kon saqlanib qoladi.</div><input id="nsN" placeholder="Do‘kon nomi (login)" autocomplete="off" maxlength="40"><input id="nsP" type="text" placeholder="Parol (kamida 4 ta belgi)" autocomplete="off" maxlength="60"><div class="hint" id="nsE" style="color:var(--danger);display:none;font-weight:700"></div><button class="btn btn-primary btn-block" type="submit" id="nsGo">Do‘konni yaratish</button><button class="btn btn-block" type="button" id="nsCancel">Bekor qilish</button></form>','shopsOv');

    if(e.target.closest('#nsCancel')){ov.querySelector('#shopForm').style.display='none';ov.querySelector('#shopAdd').style.display='';return;}});
  ov.querySelector('#shopForm').onsubmit=async(e)=>{e.preventDefault();
    const n=ov.querySelector('#nsN').value.trim(),pw=ov.querySelector('#nsP').value,k=normUser(n),er=ov.querySelector('#nsE'),go=ov.querySelector('#nsGo');
    const bad=m=>{er.textContent=m;er.style.display='block';go.disabled=false;go.textContent='Do‘konni yaratish';};
    if(!n||!k)return bad('Do‘kon nomini yozing');
    if(pw.length<4)return bad('Parol kamida 4 ta belgidan iborat bo‘lsin');
    if(allUsers().find(u=>u.key===k))return bad('Bu nom band. Boshqa nom tanlang.');
    go.disabled=true;go.textContent='Yaratilmoqda…';
    if(window.__qdx.isSrv()){try{const idx=await window.__qdx.cget('qd_idx/'+k);if(idx)return bad('Bu nom band. Boshqa nom tanlang.');}catch(x){if(x&&x.status===403)return bad('Bu nom band. Boshqa nom tanlang.');}}

    if(!saveUsers(us))return bad('Saqlab bo‘lmadi. Qaytadan urinib ko‘ring.');

function openStaff(){
  if(S.demo){toast('Demo rejimda xodim qo‘shib bo‘lmaydi',false);return;}
  if(!qdCan('staff')){toast('Xodimlarni faqat do‘kon egasi boshqaradi',false);return;}

  const opts=sel=>STAFF_ROLES.map(x=>'<option value="'+x+'"'+(x===sel?' selected':'')+'>'+QD_ROLE_LABEL[x]+'</option>').join('');
  function draw(){
    const st=allUsers().filter(u=>u.owner===S.userKey);
    ov.querySelector('.modal').innerHTML=head('Xodimlar')
     +'<div class="hint" style="margin:0 0 12px;line-height:1.55">Har bir xodimga rol bering. Rol serverda ham tekshiriladi: '+STAFF_ROLES.map(r=>'<b>'+QD_ROLE_LABEL[r]+'</b> — '+QD_ROLE_HINT[r]).join('; ')+'.</div>'

     +'<form id="stF" style="display:flex;flex-direction:column;gap:8px;margin-top:12px;"><input id="stN" placeholder="Xodim logini" autocomplete="off"><input id="stP" type="password" placeholder="Parol (kamida 4 ta belgi)" autocomplete="new-password"><select id="stR" aria-label="Rol">'+opts('employee')+'</select><button class="btn btn-primary btn-block" type="submit">Xodim qo‘shish</button><div class="hint" id="stE" style="color:var(--danger)"></div></form>';
    ov.querySelector('.close-x').onclick=()=>ov.remove();
    ov.querySelectorAll('[data-role]').forEach(s=>s.onchange=()=>{const list=getUsers(),x=list.find(y=>y.key===s.dataset.role);if(x&&STAFF_ROLES.includes(s.value)){x.role=s.value;saveUsers(list);toast('Rol yangilandi');cloudKick();draw();}});
    ov.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{const key=b.dataset.del;
      // Serverdan ham o'chiramiz: aks holda xodim eski login bilan bulutga kirishda davom etadi
      if(isSrv()){try{await qdDeleteIdx(key);}catch(e){toast('Serverdan o‘chirib bo‘lmadi. Internetni tekshiring.',false);return;}}
      saveUsers(allUsers().filter(u=>u.key!==key));toast('Xodim o‘chirildi');cloudKick();draw();});
    $('#stF',ov).onsubmit=(e)=>{e.preventDefault();const n=$('#stN',ov).value.trim(),p=$('#stP',ov).value,r=$('#stR',ov).value,k=normUser(n),er=$('#stE',ov);

      const us=allUsers();if(us.find(u=>u.key===k)){er.textContent='Bu login band';return;}
      us.push({key:k,username:n,ph:hash(p),owner:S.userKey,role:STAFF_ROLES.includes(r)?r:'employee',createdAt:Date.now()});saveUsers(us);toast('Xodim qo‘shildi');cloudKick();draw();};
  }

}

document.addEventListener('submit',async function(e){
  const f=e.target;if(f.id!=='authForm'||f.__go||!curl())return;
  const un=$('#authUser').value.trim(),pw=$('#authPass').value,key=normUser(un),err=$('#authErr');
  if(!un||pw.length<4||!key)return;
  const local=allUsers().find(u=>u.key===key);
  if(authMode==='login'&&local)return;
  e.preventDefault();e.stopImmediatePropagation();
  const btn=$('#authSubmit');const lab=btn.textContent;btn.disabled=true;btn.innerHTML='<span class="spin"></span>';
  const back=()=>{btn.disabled=false;btn.textContent=lab;};

var RV_DAYS={};
function rvDaily(kind,n){
  const MN=['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentabr','oktabr','noyabr','dekabr'],WD=['Yak','Dush','Sesh','Chor','Pay','Jum','Shan'],WF=['yakshanba','dushanba','seshanba','chorshanba','payshanba','juma','shanba'];
  const map={};S[kind].forEach(c=>(c.transactions||[]).forEach(t=>{const d=new Date(t.ts||Date.now());const k=d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();const o=map[k]||(map[k]={g:0,p:0});if(t.type==='debt')o.g+=t.amount;else o.p+=t.amount;}));
  const out=[],now=new Date();
  for(let i=n-1;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i);const o=map[d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()]||{g:0,p:0};out.push({lab:String(d.getDate()),sub:WD[d.getDay()],full:d.getDate()+'-'+MN[d.getMonth()]+', '+WF[d.getDay()],g:o.g,p:o.p});}
  return out;
}
function rvChart(kind,id,rows){
  const cl=kind==='clients',n=rows.length,top=niceMax(Math.max(1,...rows.map(r=>Math.max(r.g,r.p,Math.max(r.g-r.p,0))))),sel=n-1,wide=n>7;
  const hh=v=>v>0?Math.max(3,v/top*100):0;
  const L=[cl?'Qarzga berdim':'Qarz oldim',cl?'Pul qaytdi':'Qaytardim','Qarz oshdi'];const tg=rows.reduce((a,r)=>a+r.g,0),tp=rows.reduce((a,r)=>a+r.p,0);
  return '<div class="rv-sum">'+rvSum(cl,tg,tp,id==='d'?'oxirgi '+rows.length+' kunda':'shu oylarda')+'</div><div class="rv-leg"><span><i class="k1"></i>'+L[0]+'</span><span><i class="k3"></i>'+L[1]+'</span><span><i class="k2"></i>'+L[2]+'</span></div>'
  +'<div class="rv-chart'+(wide?' wide':'')+'" data-kind="'+kind+'" data-id="'+id+'"><div class="rv-scroll"><div class="rv-in" style="'+(wide?'min-width:'+(n*50)+'px':'')+'"><div class="rv-grid">'
  +[100,75,50,25,0].map(p=>'<i style="bottom:'+p+'%">'+(p===100||p===50||p===0?'<u>'+(p===0?'0':abbr(top*p/100))+'</u>':'')+'</i>').join('')+'</div><div class="rv-cols">'
  +rows.map((r,i)=>'<div class="rv-col'+(i===sel?' on':'')+'" data-l="'+r.full+'" data-g="'+r.g+'" data-p="'+r.p+'"><div class="rv-bars"><i class="b1" style="--h:'+hh(r.g)+'%;--d:'+Math.min(i*40,600)+'ms"></i><i class="b3" style="--h:'+hh(r.p)+'%;--d:'+Math.min(i*40+30,630)+'ms"></i><i class="b2" style="--h:'+hh(Math.max(r.g-r.p,0))+'%;--d:'+Math.min(i*40+60,660)+'ms"></i></div><span class="rv-lbl">'+r.lab+(r.sub?'<small>'+r.sub+'</small>':'')+'</span></div>').join('')
  +'</div></div></div></div><div class="rv-read" id="rvRead_'+kind+'_'+id+'">'+rvRead(kind,rows[sel].full,rows[sel].g,rows[sel].p)+'</div>';
}
function rvSum(cl,g,p,when){const d=g-p;if(!g&&!p)return when+' hech narsa yozilmagan.';return when.charAt(0).toUpperCase()+when.slice(1)+' <b>'+fmt(g,S.vcur)+'</b> '+(cl?'qarzga berdingiz':'qarz oldingiz')+', <b>'+fmt(p,S.vcur)+'</b> '+(cl?'qaytdi':'qaytardingiz')+'. '+(d>0?'Qarz <b>'+fmt(d,S.vcur)+'</b> ga oshdi.':d<0?'Qarz <b>'+fmt(-d,S.vcur)+'</b> ga kamaydi — yaxshi!':'Qarz o‘zgarmadi.');}
function rvRead(k,l,g,p){const cl=k==='clients';const d=g-p;return '<b>'+l+'</b><div><span><i class="k1"></i>'+(cl?'Qarzga berdim':'Qarz oldim')+'<em>'+fmt(g,S.vcur)+'</em></span><span><i class="k3"></i>'+(cl?'Pul qaytdi':'Qaytardim')+'<em>'+fmt(p,S.vcur)+'</em></span><span><i class="k2"></i>'+(d>=0?'Qarz oshdi':'Qarz kamaydi')+'<em>'+fmt(Math.abs(d),S.vcur)+'</em></span></div>';}
function rvPick(e){const c=e.target.closest&&e.target.closest('.rv-col');if(!c||c.classList.contains('on'))return;const w=c.closest('.rv-chart');w.querySelectorAll('.rv-col').forEach(x=>x.classList.toggle('on',x===c));const k=w.dataset.kind,r=document.getElementById('rvRead_'+k+'_'+w.dataset.id);if(r){r.innerHTML=rvRead(k,c.dataset.l,+c.dataset.g,+c.dataset.p);r.classList.remove('flash');void r.offsetWidth;r.classList.add('flash');}}
document.addEventListener('click',rvPick);document.addEventListener('mouseover',rvPick);
function rvScroll(){document.querySelectorAll('.rv-chart.wide .rv-scroll').forEach(x=>{x.scrollLeft=x.scrollWidth;});}
new MutationObserver(()=>{if(document.querySelector('.rv-chart.wide .rv-scroll')&&!document.querySelector('.rv-scroll[data-s]')){document.querySelectorAll('.rv-scroll').forEach(x=>x.dataset.s=1);rvScroll();}}).observe(document.body,{childList:true,subtree:true});
document.addEventListener('click',e=>{const b=e.target.closest('.rv-chip');if(!b)return;const k=b.parentNode.dataset.kind;RV_DAYS[k]=+b.dataset.d;const sec=b.closest('.rv-sec');sec.innerHTML=sec.innerHTML.split('<div class="rv-leg">')[0].replace(/<div class="rv-chips"[\s\S]*$/,'')+'';
  const tmp=document.createElement('div');tmp.innerHTML='<div class="rv-h">So‘nggi kunlar</div><div class="rv-chips" data-kind="'+k+'">'+[7,14,30].map(d=>'<button type="button" class="rv-chip'+(d===RV_DAYS[k]?' on':'')+'" data-d="'+d+'">'+d+' kun</button>').join('')+'</div>'+rvChart(k,'d',rvDaily(k,RV_DAYS[k]));sec.innerHTML=tmp.innerHTML;requestAnimationFrame(rvScroll);});

const tk=()=>'trash_'+skey(S.userKey);
function trashGet(){let l=[];try{l=JSON.parse(storageGet(tk())||'[]');}catch(e){}const n=Date.now(),k=l.filter(x=>x.at+30*DAY>n);if(k.length!==l.length)storageSet(tk(),JSON.stringify(k));return k;}
function trashSet(l){storageSet(tk(),JSON.stringify(l));}
function trashAdd(kind,c){const l=trashGet();l.push({kind:kind,at:Date.now(),c:JSON.parse(JSON.stringify(c))});trashSet(l);}
function trashAddTx(kind,c,t){const l=trashGet();l.push({kind:kind,at:Date.now(),tx:JSON.parse(JSON.stringify(t)),pid:c.id,pname:c.name,cur:curOf(c)});trashSet(l);}
function tid(e){return e.tx?e.tx.id:e.c.id;}
function trashRemove(id){trashSet(trashGet().filter(x=>tid(x)!==id));}
function trashRestore(id){const l=trashGet(),e=l.find(x=>tid(x)===id);if(!e)return;
  if(e.tx){const p=S[e.kind].find(c=>c.id===e.pid);if(!p){toast('Avval «'+e.pname+'» ni qaytaring',false);return;}
    if(!p.transactions.find(t=>t.id===e.tx.id)){p.transactions.push(e.tx);p.transactions.sort((a,b)=>(a.ts||0)-(b.ts||0));}
    trashSet(l.filter(x=>x!==e));saveShopData();toast('Yozuv qaytarildi: '+e.pname);refreshView();return;}
  trashSet(l.filter(x=>x!==e));if(!S[e.kind].find(c=>c.id===id))S[e.kind].push(e.c);saveShopData();toast('Qaytarildi: '+e.c.name);refreshView();}

const CURS={UZS:{pre:'',name:'so‘m',ph:'500000',q:[]},USD:{pre:'$',name:'$ dollar',ph:'50',q:[5,10,50,100]},EUR:{pre:'€',name:'€ yevro',ph:'50',q:[5,10,50,100]},RUB:{pre:'₽',name:'₽ rubl',ph:'5000',q:[500,1000,5000,10000]},KZT:{pre:'₸',name:'₸ tenge',ph:'50000',q:[5000,10000,50000,100000]}};

const SOM='so‘m';
function curOf(c){return (c&&CURS[c.cur])?c.cur:'UZS';}
function fmt(n,cur){
  n=+n||0;const usd=(cur||S.vcur)!=='UZS';
  let r=usd?Math.round(n*100)/100:Math.round(n);const neg=r<0;r=Math.abs(r);
  const p=r.toFixed(usd&&r%1?2:0).split('.');
  let s=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,' ')+(p[1]?'.'+p[1]:'');
  if(cur==='UZS')s+=' '+SOM;else if(CURS[cur])s=CURS[cur].pre+s;
  return (neg?'-':'')+s;
}
function unitize(h,cur){
  if(cur==='UZS'||!CURS[cur]||typeof h!=='string')return h;const P=CURS[cur].pre;
  h=h.replace(/\(so[‘’'ʻ]m\)/g,()=>'('+P+')');
  return h.replace(/(\d(?:[\d  ]*\d)?(?:\.\d+)?)(?:\s|&nbsp;)*(?:<small[^>]*>)?\s*so[‘’'ʻ]m(?:ga)?(?:<\/small>)?/g,(m,d)=>P+d);
}
const RATE_DEF={USD:11900,EUR:13340,RUB:140,KZT:26.2};
function loadRates(){let r={};try{r=JSON.parse(storageGet('rates')||'{}')||{};}catch(e){}const o={};Object.keys(RATE_DEF).forEach(k=>{const n=+r[k];o[k]=n>0?n:RATE_DEF[k];});return o;}
S.rates=loadRates();
function rateOf(k){return k==='UZS'?1:(S.rates[k]||RATE_DEF[k]||1);}
function conv(n,from,to){return from===to?n:n*rateOf(from)/rateOf(to);}
function asCur(c,v){const f=curOf(c);if(f===v)return c;return Object.assign({},c,{cur:v,transactions:(c.transactions||[]).map(t=>Object.assign({},t,{amount:conv(t.amount,f,v),cur:v}))});}
function hasMixed(){return S.clients.concat(S.lenders).some(c=>curOf(c)!==S.vcur);}
function rateTxt(k){const r=rateOf(k);return '1 '+(CURS[k].pre||'')+' = '+String(Math.round(r*100)/100).replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' soʼm';}

(function(){

function monthsData(){
  const now=new Date(),out=[];
  for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);out.push({y:d.getFullYear(),m:d.getMonth(),given:0,paid:0});}

}
function aging(){
  const b=[['Muddati o‘tmagan',0],['1–7 kun',0],['8–30 kun',0],['30 kundan ko‘p',0]];
  S.clients.forEach(c=>{const bal=balanceOf(c);if(!(bal>0))return;const v=conv(bal,curOf(c),S.vcur);const d=c.dueDate?daysOverdue(c.dueDate):-1;b[d<=0?0:d<=7?1:d<=30?2:3][1]+=v;});return b;

  const v=t.closest('[data-var]');if(v){const ta=OV.querySelector('#'+v.dataset.for);const i=ta.selectionStart||ta.value.length;ta.value=ta.value.slice(0,i)+v.dataset.var+ta.value.slice(i);ta.focus();prev();return;}

  const pay=t.closest('[data-pay]');if(pay){const o=C.pk.orders.find(x=>x.id===pay.dataset.pay);if(o)orderModal(o);return;}}

function qdBuckets(period,list,range){

  const start=qdAddDays(T,-(R-1));
  const N=period==='day'?R:period==='week'?Math.ceil(R/7):Math.max(1,Math.round(R/30));
  for(let i=N-1;i>=0;i--){
    let from,to,label,title;
    if(period==='day'){to=qdAddDays(T,-i);from=to;label=String(new Date(to+'T00:00:00').getDate());title=fmtDate(to);}
    else if(period==='week'){to=qdAddDays(T,-7*i);from=qdAddDays(to,-6);if(from<start)from=start;label=qdDM(from);title=fmtDate(from)+' — '+fmtDate(to);}
    else{const now=new Date(T+'T00:00:00');const f=new Date(now.getFullYear(),now.getMonth()-i,1);
      from=qdDay(f.getTime());to=i===0?T:qdDay(new Date(f.getFullYear(),f.getMonth()+1,0).getTime());
      if(from<start)from=start;
      label=QD_MON[f.getMonth()];title=UZ_MONTHS[f.getMonth()]+' '+f.getFullYear();}
    let lent=0,recv=0,cnt=0;
    list.forEach(c=>(c.transactions||[]).forEach(t=>{const d=qdDay(t.ts);if(d>=from&&d<=to){cnt++;if(t.type==='debt')lent+=+t.amount||0;else recv+=+t.amount||0;}}));
    out.push({from:from,to:to,label:label,title:title,lent:lent,recv:recv,cnt:cnt,open:qdRemainingAt(list,qdAddDays(from,-1)),rem:qdRemainingAt(list,to)});

function qdFlowRead(b,cur,kind){
  if(!b) return '';
  const L=kind==='lenders'?['Yangi olingan qarz','Qaytarilgan pul']:['Yangi berilgan qarz','Qaytgan pul'];
  const cu=qH(qdCurLabel(cur));
  const row=(cls,sign,label,val)=>'<div><i class="qc-sw '+cls+'"></i><span>'+sign+' '+label+'</span><b>'+qH(qdFmt(val,cur))+' '+cu+'</b></div>';
  return '<div class="qc-rt">'+qH(b.title)+'<small>'+(b.cnt||0)+' ta yozuv</small></div><div class="qc-rr">'
    +'<div class="qc-hist"><i class="qc-sw open"></i><span>Oldingi qarz (davr boshida)</span><b>'+qH(qdFmt(b.open||0,cur))+' '+cu+'</b></div>'
    +row('lent','+',L[0],b.lent)
    +row('recv','−',L[1],b.recv)
    +'<div class="qc-end"><i class="qc-sw rem"></i><span>Davr oxirida qolgan</span><b>'+qH(qdFmt(b.rem,cur))+' '+cu+'</b></div></div>';
}
// Boshqaruv: kunlik / haftalik / oylik va Mijozlar / Qarzlarim filtrlari bilan interaktiv grafik
function qdFlowCard(){
  const kind=S.cKind==='lenders'?'lenders':'clients';
  const range=QD_CH_RANGE.some(r=>r[0]===S.cRange)?S.cRange:7;
  const okPer=QD_CH_GRAN[range], period=okPer.includes(S.cPeriod)?S.cPeriod:okPer[0];
  const list=kind==='lenders'?qdViewLenders():qdViewAll(), cur=S.vcur, B=qdBuckets(period,list,range);
  const sel=(S.cSel!=null&&S.cSel>=0&&S.cSel<B.length)?S.cSel:B.length-1;
  QC.qcCard={B:B,cur:cur,kind:kind};
  return '<section class="qc-card card" id="qcCard">'
    +'<div class="qc-head"><h3 class="disp">Pul harakati</h3><p class="hint">Ustunni bosing — aniq summa va sana chiqadi</p></div>'
    +'<div class="qc-tools">'
      +'<div class="qc-seg" role="group" aria-label="Ro‘yxat">'+QD_CH_KIND.map(([k,l])=>'<button type="button" class="'+(k===kind?'on':'')+'" data-qckind="'+k+'" aria-pressed="'+(k===kind)+'">'+l+'</button>').join('')+'</div>'
      +'<div class="qc-seg" role="group" aria-label="Davr uzunligi">'+QD_CH_RANGE.map(([k,l])=>'<button type="button" class="'+(k===range?'on':'')+'" data-qcrange="'+k+'" aria-pressed="'+(k===range)+'">'+l+'</button>').join('')+'</div>'
      +'<div class="qc-seg" role="group" aria-label="Statistika">'+QD_CH_PER.map(([k,l])=>{const off=!okPer.includes(k);return '<button type="button" class="'+(k===period?'on':'')+'" data-qcper="'+k+'" aria-pressed="'+(k===period)+'"'+(off?' disabled title="Bu davr uchun mos emas"':'')+'>'+l+'</button>';}).join('')+'</div>'
    +'</div>'
    +qdFlowPlot(B,cur,sel,kind,'qcCard')
    +qdFlowLegend(kind,cur)
    +'<div class="qc-read" id="qcRead" aria-live="polite">'+qdFlowRead(B[sel],cur,kind)+'</div>'
    +'</section>';
}
// Haftalik / oylik tablarida: kunlik ustunlar (faqat mijozlar)
function qdBarsHtml(days,cur){
  const n=days.length;
  if(!n) return '';
  const list=qdViewAll();
  const B=days.map(x=>{const dt=new Date(x.d+'T00:00:00');return {from:x.d,to:x.d,label:n<=7?QD_WD[dt.getDay()]:String(dt.getDate()),title:fmtDate(x.d),lent:x.s.debt[cur]||0,recv:x.s.pay[cur]||0,rem:qdRemainingAt(list,x.d),open:qdRemainingAt(list,qdAddDays(x.d,-1)),cnt:list.reduce((s,c)=>s+(c.transactions||[]).filter(t=>qdDay(t.ts)===x.d).length,0)};});
  const tot={d:0,p:0};B.forEach(b=>{tot.d+=b.lent;tot.p+=b.recv;});
  QC.qcStatic={B:B,cur:cur,kind:'clients'};
  return '<div class="qd-stats"><div><small>Berilgan qarz</small><b>'+qdFmt(tot.d,cur)+'</b></div><div><small>Qabul qilingan</small><b>'+qdFmt(tot.p,cur)+'</b></div><div><small>Farq</small><b>'+qdFmt(tot.d-tot.p,cur)+'</b></div></div>'
    +'<section class="qc-card card" id="qcStatic">'+qdFlowPlot(B,cur,n-1,'clients','qcStatic')+qdFlowLegend('clients',cur)
    +'<div class="qc-read" id="qcRead">'+qdFlowRead(B[n-1],cur,'clients')+'</div></section>';
}
function qdTxRow(x){return '<div class="qd-li"><div><b>'+qH(x.c.name||'—')+'</b><small>'+(x.pay?'To‘lov':'Qarz')+(x.t.note?' · '+qH(x.t.note):'')+' · '+x.day+'</small></div><span class="qd-amt" style="color:'+(x.pay?'var(--qd-pay)':'var(--qd-debt)')+'">'+(x.pay?'+':'−')+qdFmt(x.amt,x.cur)+' '+qdCurLabel(x.cur)+'</span></div>';}
function qdPeriodToolbar(){return '<div class="qd-toolbar"><label class="hint" style="margin:0;display:flex;gap:8px;align-items:center">Sana <input type="date" id="qdRepDate" value="'+qH(qdRepDate())+'" max="'+todayISO()+'"></label></div>';}
function qdDashHtml(){
  const s=qdStats(),cur=qdDomCur(s.last7),lend=qdCan('lenders')?qdViewLenders().reduce((m,c)=>qdAdd(m,qdCurOf(c),Math.max(balanceOf(c),0)),{}):null;
  return '<div class="kpi-grid">'+qdKpi('Jami qarzdorlik',s.outstanding)+qdKpi('Bugun yig‘ildi',s.today.pay,'good')
   +'<div class="kpi bad"><small>Muddati o‘tgan ('+s.overdueN+' ta)</small><b>'+qdMoney(s.overdue)+'</b></div>'
   +'<div class="kpi"><small>7 kun ichida muddati ('+s.upcomingN+' ta)</small><b>'+qdMoney(s.upcoming)+'</b></div>'
   +qdKpi('Bu oy berilgan qarz',s.month.debt)+qdKpi('Bu oy qabul qilingan',s.month.pay,'good')+'</div>'
   +qdFlowCard()
   +'<div class="qd-sec">Mijozlar faolligi</div>'+(s.recent.length?'<div class="qd-list">'+s.recent.map(qdTxRow).join('')+'</div>':'<div class="empty">Hali yozuvlar yo‘q</div>')
   +(lend?'<div class="qd-sec">Qarzlarim</div><div class="kpi-grid">'+qdKpi('Siz qarzdorsiz',lend)+'</div>':'');

function qdDayHtml(){
  const D=qdRepDate(),s=qdPeriodSum(D,D),rows=qdTxs().filter(x=>x.day===D).sort((a,b)=>(a.t.ts||0)-(b.t.ts||0));
  return qdPeriodToolbar()+'<div class="kpi-grid">'+qdKpi('Berilgan qarz',s.debt)+qdKpi('Qabul qilingan',s.pay,'good')+'<div class="kpi"><small>Yozuvlar</small><b>'+s.n+'</b></div></div>'
   +(rows.length?'<div class="qd-list">'+rows.map(qdTxRow).join('')+'</div>':'<div class="empty">Bu kunda yozuv yo‘q</div>');
}
function qdWeekHtml(){
  const D=qdRepDate(),F=qdAddDays(D,-6),days=qdRangeDays(F,D),tot=qdPeriodSum(F,D);
  return qdPeriodToolbar()+'<p class="hint" style="margin:0 0 6px">'+fmtDate(F)+' — '+fmtDate(D)+'</p><div class="kpi-grid">'+qdKpi('Berilgan qarz',tot.debt)+qdKpi('Qabul qilingan',tot.pay,'good')+'</div>'+qdBarsHtml(days,qdDomCur(days));
}
function qdMonthHtml(){
  const D=qdRepDate(),F=D.slice(0,8)+'01',days=qdRangeDays(F,D),tot=qdPeriodSum(F,D);
  return qdPeriodToolbar()+'<p class="hint" style="margin:0 0 6px">'+D.slice(0,7)+' oyi, 1-kundan '+D.slice(8)+'-kungacha</p><div class="kpi-grid">'+qdKpi('Berilgan qarz',tot.debt)+qdKpi('Qabul qilingan',tot.pay,'good')+'<div class="kpi"><small>Yozuvlar</small><b>'+tot.n+'</b></div></div>'+qdBarsHtml(days,qdDomCur(days));
}
function qdOverdueHtml(){
  const list=qdViewAll().filter(isOverdue).sort((a,b)=>daysOverdue(b.dueDate)-daysOverdue(a.dueDate));

   +(list.length?'<div class="qd-list">'+list.map(c=>{const d=daysOverdue(c.dueDate),b=balanceOf(c),cu=qdCurOf(c);

}
function qdRankHtml(){
  const owe=qdViewAll().map(c=>({c:c,v:balanceOf(c)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v).slice(0,10);
  const paid=qdViewAll().map(c=>({c:c,v:(c.transactions||[]).filter(t=>t.type!=='debt').reduce((s,t)=>s+(+t.amount||0),0)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v).slice(0,10);
  const row=(x,i)=>'<div class="qd-li"><span class="qd-amt" style="width:22px;color:var(--text-dim,#75675E)">'+(i+1)+'</span><div><b>'+qH(x.c.name||'—')+'</b><small>'+qH(x.c.phone||'')+'</small></div><span class="qd-amt">'+qdFmt(x.v,qdCurOf(x.c))+' '+qdCurLabel(qdCurOf(x.c))+'</span></div>';
  return '<div class="qd-sec">Eng ko‘p qarzdor (qoldiq)</div>'+(owe.length?'<div class="qd-list">'+owe.map(row).join('')+'</div>':'<div class="empty">Qarzdorlar yo‘q</div>')
   +'<div class="qd-sec">Eng ko‘p to‘lagan</div>'+(paid.length?'<div class="qd-list">'+paid.map(row).join('')+'</div>':'<div class="empty">Hali to‘lovlar yo‘q</div>')
   +'<p class="hint" style="margin:8px 0 0">Saralash nominal summa bo‘yicha; valyutalar alohida ko‘rsatilgan.</p>';
}
function qdExportHtml(){
  return '<div class="qd-sec">Eksport</div><p class="hint" style="margin:0 0 10px">CSV fayl Excel’da ochiladi (UTF-8, BOM bilan). Harflar buzilsa, Excel’da Ma’lumot → Matndan/CSV orqali UTF-8 ni tanlang.</p>'
   +'<div class="qd-toolbar"><button class="qd-btn primary" type="button" data-rep-act="csv-clients">Mijozlar (CSV)</button><button class="qd-btn" type="button" data-rep-act="csv-tx">Barcha yozuvlar (CSV)</button><button class="qd-btn" type="button" data-rep-act="pdf">Hisobot — PDF</button></div>'
   +'<p class="hint">PDF: chop etish oynasida «PDF sifatida saqlash» (Save as PDF) ni tanlang. Ro‘yxatda faqat mijozlar bor; qarzlarim kiritilmaydi.</p>';
}
// CSV: Excel formulasini oldini olish uchun =,+,-,@ bilan boshlangan matn ' bilan boshlanadi
function qdCsv(rows){return '﻿'+rows.map(r=>r.map(v=>{let s=String(v==null?'':v);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}).join(',')).join('\r\n');}
function qdDownload(name,text){const u=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},0);}
function qdCsvClients(){
  const rows=[['Ism','Telefon','Qoldiq','Valyuta','Muddat','Holat','Oxirgi yozuv']];
  S.clients.forEach(c=>{const last=(c.transactions||[]).reduce((m,t)=>Math.max(m,t.ts||0),0),b=balanceOf(c);
    rows.push([c.name||'',c.phone||'',b,qdCurOf(c),c.dueDate||'',isOverdue(c)?'muddati o‘tgan':(b>0?'faol':'yopilgan'),last?qdDay(last):'']);});
  qdDownload('qarz-daftar-mijozlar-'+todayISO()+'.csv',qdCsv(rows));
}
function qdCsvTx(){
  const rows=[['Sana','Vaqt','Mijoz','Tur','Summa','Valyuta','Izoh']];
  qdTxs(S.clients).sort((a,b)=>(a.t.ts||0)-(b.t.ts||0)).forEach(x=>rows.push([x.day,new Date(x.t.ts||0).toTimeString().slice(0,5),x.c.name||'',x.pay?'To‘lov':'Qarz',x.amt,x.cur,x.t.note||'']));
  qdDownload('qarz-daftar-yozuvlar-'+todayISO()+'.csv',qdCsv(rows));
}
function qdPrint(){
  const s=qdStats();let area=document.getElementById('qdPrintArea');
  if(!area){area=document.createElement('div');area.id='qdPrintArea';document.body.appendChild(area);}
  const rows=S.clients.map(c=>'<tr><td>'+qH(c.name||'')+'</td><td>'+qH(c.phone||'')+'</td><td style="text-align:right">'+qdFmt(balanceOf(c),qdCurOf(c))+' '+qdCurLabel(qdCurOf(c))+'</td><td>'+(c.dueDate?qH(fmtDate(c.dueDate)):'')+'</td></tr>').join('');
  area.innerHTML='<h2>Qarzim — hisobot</h2><p>Sana: '+todayISO()+' · Jami qarzdorlik: '+qdMoney(s.outstanding)+' · Muddati o‘tgan: '+qdMoney(s.overdue)+'</p><table><thead><tr><th>Ism</th><th>Telefon</th><th style="text-align:right">Qoldiq</th><th>Muddat</th></tr></thead><tbody>'+rows+'</tbody></table>';
  window.print();
}

  if(!qdCan('reports'))return '<div class="view-intro"><h1 class="disp">Hisobot</h1></div><div class="empty">Hisobot sizning rolingizda ochiq emas.</div>';
  const tab=S.repTab||'dash';
  const body=tab==='dash'?qdDashHtml():tab==='day'?qdDayHtml():tab==='week'?qdWeekHtml():tab==='month'?qdMonthHtml():tab==='overdue'?qdOverdueHtml():tab==='rank'?qdRankHtml():qdExportHtml();
  return '<div class="view-intro"><h1 class="disp">Hisobot</h1><p>Pul qanday aylanayotganini ko‘ring</p></div>'
   +'<div class="rep-tabs" role="tablist">'+QD_REP_TABS.map(([k,l])=>'<button type="button" role="tab" class="rep-tab'+(tab===k?' on':'')+'" data-rep="'+k+'" aria-selected="'+(tab===k)+'">'+l+'</button>').join('')+'</div>'+curNote()+body;

document.addEventListener('click',e=>{
  const t=e.target.closest&&e.target.closest('[data-rep],[data-rep-act]');if(!t)return;
  if(t.dataset.rep){S.repTab=t.dataset.rep;refreshView();return;}
  const a=t.dataset.repAct;if(a==='csv-clients')qdCsvClients();else if(a==='csv-tx')qdCsvTx();else if(a==='pdf')qdPrint();
});
document.addEventListener('change',e=>{if(e.target&&e.target.id==='qdRepDate'){S.repDate=e.target.value||todayISO();refreshView();}});
document.addEventListener('click',e=>{
  const k=e.target.closest&&e.target.closest('[data-qckind],[data-qcper],[data-qcrange],[data-qcol]');if(!k)return;
  if(k.dataset.qcol!==undefined){
    const i=+k.dataset.qcol,cid=k.dataset.cid,d=QC[cid],card=document.getElementById(cid);
    if(!d||!card||!d.B[i])return;
    card.querySelectorAll('.qc-col').forEach((c,j)=>{c.classList.toggle('on',j===i);c.setAttribute('aria-pressed',String(j===i));});
    card.querySelectorAll('.qc-dot').forEach((c,j)=>c.classList.toggle('on',j===i));
    const r=card.querySelector('#qcRead');if(r)r.innerHTML=qdFlowRead(d.B[i],d.cur,d.kind);
    if(cid==='qcCard')S.cSel=i;
    return;
  }
  if(k.dataset.qckind){S.cKind=k.dataset.qckind;S.cSel=null;}
  else if(k.dataset.qcrange){S.cRange=+k.dataset.qcrange;S.cSel=null;}
  else{S.cPeriod=k.dataset.qcper;S.cSel=null;}
  const card=document.getElementById('qcCard');if(card)card.outerHTML=qdFlowCard();
});

  /* ---------- diagrammalar ---------- */
  function emptyBox(title, text) {

  function tipSeries(r) {
    return '<b>' + esc(keyLabel(r.key)) + '</b>' +
      '<div>Daromad <b>' + esc(moneyUzs(r.revenue)) + '</b></div>' +
      '<div>Sof foyda <b>' + esc(moneyUzs(r.netProfit)) + '</b></div>' +

      '<div>Sotuvlar <b>' + esc(r.sales || 0) + '</b></div>';
  }
  /* Silliq chiziq (Catmull-Rom → Bezier). */
  function smoothPath(pts) {
    if (!pts.length) return '';
    var d = 'M' + pts[0][0].toFixed(1) + ',' + pts[0][1].toFixed(1), i;
    for (i = 0; i < pts.length - 1; i++) {
      var p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      var c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
      var c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
      d += 'C' + c1x.toFixed(1) + ',' + c1y.toFixed(1) + ' ' + c2x.toFixed(1) + ',' + c2y.toFixed(1) + ' ' + p2[0].toFixed(1) + ',' + p2[1].toFixed(1);
    }
    return d;
  }
  /* Tekis, o‘qishga qulay o‘qlar: 4 ta oraliq, toza yaxlitlangan qiymatlar. */
  function niceTicks(lo, hi) {
    var raw = (hi - lo) / 4 || 1, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
    var st = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
    var a = Math.floor(lo / st + 1e-9), b = Math.ceil(hi / st - 1e-9), out = [], k;
    for (k = a; k <= b; k++) out.push(k * st);
    return out;
  }
  function seriesChart(rows) {
    if (!rows || !rows.length) return emptyBox('Ma’lumot yo‘q', 'Tanlangan davrda sotuv yoki xarajat yozilmagan.');
    var W = 720, H = 292, pl = 62, pr = 16, pt = 22, pb = 30, n = rows.length;
    var vals = []; rows.forEach(function (r) { vals.push(r.revenue || 0, r.netProfit || 0); });
    var hi0 = Math.max.apply(null, [0].concat(vals)), lo0 = Math.min.apply(null, [0].concat(vals));
    var ticks = niceTicks(lo0, hi0 === lo0 ? lo0 + 1 : hi0);
    var lo = ticks[0], hi = ticks[ticks.length - 1], span = (hi - lo) || 1;
    var plotH = H - pt - pb, plotW = W - pl - pr;
    var y = function (v) { return pt + plotH * (hi - v) / span; };
    var band = plotW / n, y0 = y(0);
    var x = function (i) { return pl + band * i + band / 2; };
    var g = '', i, t, tot = { rev: 0, net: 0, sales: 0 };

    // To‘r: gorizontal to‘rlar (hairline) va o‘q yorliqlari
    ticks.forEach(function (v) {
      var yy = y(v).toFixed(1);
      g += '<line class="grid" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + yy + '" y2="' + yy + '"/>' +
        '<text class="ax" x="' + (pl - 10) + '" y="' + (+yy + 4) + '" text-anchor="end">' + esc(shortNum(v)) + '</text>';
    });
    g += '<line class="base" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y0.toFixed(1) + '" y2="' + y0.toFixed(1) + '"/>';

    var rPts = [], nPts = [];
    rows.forEach(function (r, idx) {
      rPts.push([x(idx), y(r.revenue || 0)]);
      nPts.push([x(idx), y(r.netProfit || 0)]);
      tot.rev += r.revenue || 0; tot.net += r.netProfit || 0; tot.sales += r.sales || 0;
    });
    // Daromad: yumshoq maydon (10% shaffoflik) + 2px chiziq
    var last = rPts[rPts.length - 1];
    var rLine = smoothPath(rPts);
    g += '<path class="area" d="' + rLine + 'L' + last[0].toFixed(1) + ',' + y0.toFixed(1) + 'L' + rPts[0][0].toFixed(1) + ',' + y0.toFixed(1) + 'Z"/>';
    g += '<path class="ln-rev" d="' + rLine + '"/>';
    // Sof foyda: 2px chiziq (boshqa shakl — ikkilamchi kodlash)
    g += '<path class="ln-net" d="' + smoothPath(nPts) + '"/>';

    // O‘q yorliqlari (kerak bo‘lsa siyrak)
    var step = Math.max(1, Math.ceil(n / 8));
    rows.forEach(function (r, idx) {
      // Oxirgi yorliq bilan to‘qnashmasligi uchun, oxiriga yaqin oraliq yorliqlar o‘tkazib yuboriladi
      if ((idx % step === 0 && idx <= n - 1 - Math.ceil(step / 2)) || idx === n - 1) {
        var anchor = idx === 0 ? 'start' : (idx === n - 1 ? 'end' : 'middle');
        g += '<text class="ax" x="' + x(idx).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="' + anchor + '">' + esc(keyLabel(r.key)) + '</text>';
      }
    });

    // Hover: har bir davr uchun guruh — nishon (hit), vertikal chiziq va nuqtalar
    rows.forEach(function (r, idx) {
      V.tips.push(tipSeries(r));
      var cx = x(idx).toFixed(1), isLast = idx === n - 1;
      g += '<g class="pp">' +
        '<rect class="hit" data-tip="' + (V.tips.length - 1) + '" x="' + (pl + band * idx).toFixed(1) + '" y="' + pt + '" width="' + band.toFixed(1) + '" height="' + plotH + '" fill="transparent"/>' +
        '<line class="xl" x1="' + cx + '" x2="' + cx + '" y1="' + pt + '" y2="' + y0.toFixed(1) + '"/>' +
        '<circle class="dn' + (isLast ? ' on' : '') + '" cx="' + cx + '" cy="' + y(r.netProfit || 0).toFixed(1) + '" r="4"/>' +
        '<circle class="dt' + (isLast ? ' on' : '') + '" cx="' + cx + '" cy="' + y(r.revenue || 0).toFixed(1) + '" r="4.5"/>' +
        '</g>';
    });

    var neg = tot.net < 0;
    var strip = '<div class="v11-cstrip">' +
      '<div><small>Daromad</small><b>' + esc(moneyUzs(tot.rev)) + '</b></div>' +
      '<div><small>Sof foyda</small><b class="' + (neg ? 'v11-neg' : '') + '">' + esc(moneyUzs(tot.net)) + '</b></div>' +
      '<div><small>Sotuvlar</small><b>' + esc(tot.sales) + '</b></div></div>';
    return strip +
      '<div class="v11-chart"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Daromad va sof foyda grafigi">' + g + '</svg></div>' +
      '<div class="v11-legend"><span><i class="ln area"></i>Daromad</span><span><i class="ln net"></i>Sof foyda</span><span class="v11-hint">Ustiga olib boring — tafsilot</span></div>';
  }
  function hbars(items, o) {
    o = o || {};

    var key = o.val || 'value', lab = o.label || 'name', f = o.fmt || moneyUzs;
    var m = Math.max.apply(null, [1].concat(items.map(function (i) { return Math.abs(i[key]) || 0; })));
    return items.map(function (i) {

  /* ---------- tanlovlar: bo‘limga o‘tish, davr, amallar ---------- */
  async function setPeriod(preset) {
    V.period.preset = preset;
    if (preset !== 'custom') { V.period.from = ''; V.period.to = ''; }
    V.jlimit = 200;
    await loadAll();

  function renderNavAndMain() { renderNav(); render(); }
  async function go(id) { V.section = id; V.loadErr = ''; renderNavAndMain(); if (V.me) await loadAll(); }

  async function doAction(act, t) {
    switch (act) {
      case 'close': close(); return;
      case 'demo-exit': {
        if (X.exitDemo) X.exitDemo();
        close();
        return;
      }
      case 'theme': V.theme = V.theme === 'dark' ? 'light' : 'dark'; V.root.setAttribute('data-theme', V.theme); try { localStorage.setItem('qarzim_v11_theme', V.theme); } catch (e) { /* */ } return;
      case 'refresh': await loadAll(); note('Yangilandi'); return;
      case 'activate': {
        var r = await api('POST', '/activate', { opId: opId('act') });
        if (r.ok) { note(r.data.already ? 'Hisob allaqachon faollashtirilgan' : 'Moliya hisobi faollashtirildi'); await loadAll(); } else note(errText(r), false);
        return;
      }
      case 'jmore': V.jlimit += 200; await loadAll(); return;
      case 'export': return exportSheet(t.dataset.sheet);
      case 'pdf': return printReport();
      case 'prod-new': return productModal(null);
      case 'prod-edit': return productModal((V.state.products || []).find(function (p) { return p.id === t.dataset.id; }) || null);
      case 'prod-archive': {
        var p = (V.state.products || []).find(function (x) { return x.id === t.dataset.id; });
        if (!p) return;
        // server qisman yangilashni qo‘llaydi: faqat id va archived yuboriladi, qolgan maydonlar saqlanadi
        var body = { opId: opId('arc'), id: p.id, archived: t.dataset.arch === '1' };
        var rr = await api('POST', '/product', body);
        if (rr.ok) { note(body.archived ? 'Arxivga olindi' : 'Tiklandi'); await loadAll(); } else note(errText(rr), false);
        return;
      }
      case 'cat-del': {
        var rc = await api('POST', '/category/delete', { opId: opId('cdl'), kind: t.dataset.kind, name: t.dataset.name });
        if (rc.ok) { note('O‘chirildi'); await loadAll(); } else note(errText(rc), false);
        return;
      }
      case 'pl-add': captureLines(); if (V.purchRows.length < 30) V.purchRows.push({ pid: '', qty: '', price: '' }); render(); return;
      case 'pl-del': {
        captureLines();
        if (V.purchRows.length > 1) { V.purchRows.splice(+t.dataset.idx, 1); render(); }
        return;
      }
      case 'rev': return reverseFlow(t.dataset.kind, t.dataset.id);
      case 'pay-confirm': {
        var pc = await api('POST', '/payment/confirm', { opId: opId('pcf'), entryId: t.dataset.id });
        if (pc.ok) { note('To‘lov tasdiqlandi'); await loadAll(); } else note(errText(pc), false);
        return;
      }
      case 'rej-restore': case 'rej-restore-neg': {
        if (!X.rej) return;
        var okR = X.rej.restore(t.dataset.id, act === 'rej-restore-neg');
        if (okR) { note('Qayta yuborildi. Natija “Saqlanmagan sotuvlar”da ko‘rinadi.'); render(); } else note('Topilmadi', false);
        return;
      }
      case 'rej-discard': {
        if (!X.rej) return;
        if (window.confirm && !window.confirm('Bu saqlanmagan sotuv butunlay o‘chirilsinmi?')) return;
        X.rej.discard(t.dataset.id); note('O‘chirildi'); render(); return;
      }
      case 'ai-ex': { var ta = V.root.querySelector('#v11Main textarea[name=q]'); if (ta) { ta.value = t.dataset.q; ta.focus(); } return;
      }
      case 'import-file': return;
      default: return;
    }
  }

  /* ---------- formalar ---------- */
  async function formHandler(form) {
    var kind = form.dataset.form;
    var f = form.elements;
    if (kind === 'period') {
      var from = f.from.value, to = f.to.value;
      if (!from || !to) return 'Sanalarni kiriting';
      if (from > to) return 'Boshlanish sanasi tugashidan katta bo‘lmasin';
      V.period.preset = 'custom'; V.period.from = from; V.period.to = to; V.jlimit = 200;
      await loadAll(); return null;
    }
    if (kind === 'cat') {
      var name = (f.name.value || '').trim();
      if (name.length < 2) return 'Kamida 2 belgi';
      var r = await api('POST', '/category', { opId: opId('cat'), kind: form.dataset.kind, name: name });
      if (!r.ok) return errText(r);
      note('Qo‘shildi'); await loadAll(); return null;
    }
    if (kind === 'expense') {
      var amount = pnum(f.amount.value);
      if (!(amount > 0)) return 'Summani kiriting';
      var rx = await api('POST', '/expense', { opId: opId('exp'), amount: amount, cur: f.cur.value, category: f.category.value, method: f.method.value, day: f.day.value, note: f.note.value });
      if (!rx.ok) return errText(rx);
      note('Xarajat saqlandi'); await loadAll(); return null;
    }
    if (kind === 'move') {
      var mk = form.dataset.kind, reason = (f.reason.value || '').trim();
      if (reason.length < 3) return 'Sabab kamida 3 belgi bo‘lsin';
      var body = { opId: opId('mv'), kind: mk, productId: f.productId.value, reason: reason };
      if (mk === 'writeoff') {
        var q = pnum(f.qty.value); if (!(q > 0)) return 'Miqdorni kiriting';
        body.qty = q; if (f.allowNegative && f.allowNegative.checked) body.allowNegative = true;
      } else {
        var c = pnum(f.counted.value); if (c === null || c < 0) return 'Haqiqiy miqdorni kiriting';
        body.counted = c;
      }
      var rm = await api('POST', '/move', body);
      if (!rm.ok) return errText(rm);
      note('Saqlandi'); await loadAll(); return null;
    }
    if (kind === 'cash-start') {
      var amt = pnum(f.amount.value); if (amt === null || amt < 0) return 'Summani to‘g‘ri kiriting';
      var rs = await api('POST', '/cash-start', { opId: opId('cst'), day: f.day.value, cur: f.cur.value, amount: amt });
      if (!rs.ok) return errText(rs);
      note('Boshlang‘ich qoldiq saqlandi'); await loadAll(); return null;
    }
    if (kind === 'cash-adj') {
      var cnt = pnum(f.counted.value); if (cnt === null || cnt < 0) return 'Sanalgan summani kiriting';
      var rj = (f.reason.value || '').trim(); if (rj.length < 3) return 'Sabab kamida 3 belgi';
      var rca = await api('POST', '/cash-adjust', { opId: opId('cad'), cur: f.cur.value, counted: cnt, reason: rj });
      if (!rca.ok) return errText(rca);
      note('Tuzatish saqlandi'); await loadAll(); return null;
    }
    if (kind === 'purchase') {
      var cur = f.cur.value, rows = form.querySelectorAll('[data-line]'), lines = [];
      Array.prototype.forEach.call(rows, function (rw) {
        var pid = rw.querySelector('[name=pid]').value, qty = pnum(rw.querySelector('[name=qty]').value), price = pnum(rw.querySelector('[name=price]').value);
        if (!pid && !qty && !price) return;
        lines.push({ productId: pid, qty: qty, unitPrice: price });
      });
      if (!lines.length) return 'Kamida bitta tovar kiriting';
      if (lines.some(function (l) { return !l.productId; })) return 'Har bir qatorda tovarni tanlang';
      if (lines.some(function (l) { return !(l.qty > 0) || l.unitPrice === null || l.unitPrice < 0; })) return 'Miqdor va narxni to‘g‘ri kiriting';
      var paidRaw = f.paid.value.trim(), paid = paidRaw === '' ? null : pnum(paidRaw);
      if (paidRaw !== '' && paid === null) return 'To‘langan summani to‘g‘ri kiriting';
      var rp = await api('POST', '/purchase', { opId: opId('pur'), cur: cur, lines: lines, paid: paid, method: f.method.value, day: f.day.value, supplier: f.supplier.value, note: f.note.value });
      if (!rp.ok) return errText(rp);
      V.purchRows = null;
      note('Kirim saqlandi'); await loadAll(); return null;
    }
    if (kind === 'ai') {
      var qv = (f.q.value || '').trim();
      if (qv.length < 2) return 'Savolni yozing';
      V.ai.busy = true; render();
      var ra = await api('POST', '/ai', { question: qv });
      V.ai.busy = false;
      if (!ra.ok) return errText(ra);
      V.ai.hist.push({ q: qv, a: ra.data });
      if (V.ai.hist.length > 30) V.ai.hist.splice(0, V.ai.hist.length - 30);
      render();
      return null;
    }
    return null;
  }

  /* ---------- eksport va chop etish ---------- */
  function periodParamsString() { return periodQS(false); }

    if (!r || !r.ok) { var d = r ? await r.json().catch(function () { return {}; }) : {}; note(errText({ status: r ? r.status : 0, data: d }), false); return; }
    var blob = await r.blob();
    var cd = r.headers.get('content-disposition') || '';
    var m = /filename="([^"]+)"/.exec(cd);
    var name = m ? m[1] : 'qarzim-' + sheet + '.xlsx';
    var url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    note('Fayl yuklab olindi');
  }

  /* ---------- ochish/yopish, hodisalar ---------- */
  function onClick(e) {
    var t = e.target.closest && e.target.closest('[data-nav],[data-act],[data-period],[data-filter-st]');
    if (!t) return;
    if (t.dataset.nav) { e.preventDefault(); go(t.dataset.nav); return; }
    if (t.dataset.filterSt) { e.preventDefault(); V.filters.stock.st = t.dataset.filterSt; render(); return; }
    if (t.dataset.period) { e.preventDefault(); setPeriod(t.dataset.period); return; }
    var act = t.dataset.act;
    if (act === 'modal-close') { closeModal(); return; }
    if (act === 'import-file') return;
    e.preventDefault();
    doAction(act, t);
  }
  function onSubmit(e) {
    var form = e.target;
    if (!form.dataset || !form.dataset.form) return;
    if (form.closest('#v11Modal')) return;
    e.preventDefault();
    runForm(form, function () { return formHandler(form); });
  }
  function onChange(e) {
    var el = e.target;
    if (el.dataset && el.dataset.filter === 'stock-cat') { V.filters.stock.cat = el.value; render(); return; }
    if (el.dataset && el.dataset.group !== undefined) { V.period.group = el.value; loadAll(); return; }
    if (el.dataset && el.dataset.act === 'import-file') { importFile(el); return; }
    if (el.dataset && el.dataset.purchCur !== undefined) {
      // valyuta o‘zgarsa tovar tanlovi tozalanadi (boshqa valyutadagi tovar kirimga tushmasin), miqdor va narx saqlanadi
      captureLines(); V.purchCur = el.value;
      if (V.purchRows) V.purchRows.forEach(function (r) { r.pid = ''; });
      render(); return;
    }
    if (el.dataset && el.dataset.adjPick !== undefined) {
      var p = (V.state.products || []).find(function (x) { return x.id === el.value; });
      var hint = V.root.querySelector('[data-adj-hint]'); if (hint && p) hint.textContent = 'Hozirgi qoldiq: ' + qtyFmt(p.qtyMilli);
      return;
    }
  }
  function onInput(e) {
    var el = e.target;
    var key = el.dataset && el.dataset.filter;
    if (key !== 'stock-q' && key !== 'prod-q') return;
    if (key === 'stock-q') V.filters.stock.q = el.value; else V.filters.products.q = el.value;
    var pos = el.selectionStart;                           // qidiruv kursori yangilashdan keyin joyida qolsin
    render();
    var again = V.root.querySelector('[data-filter=' + key + ']');
    if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (x) { /* */ } }
  }
  function onOver(e) {
    var h = e.target.closest && e.target.closest('.hit');
    if (h && V.tips[+h.dataset.tip] !== undefined) tipShow(V.tips[+h.dataset.tip], e);
  }
  function onOut(e) { if (e.target.closest && e.target.closest('.hit')) tipHide(); }
  function onKey(e) {
    if (e.key === 'Escape') {
      if (V.root.querySelector('#v11Modal.open')) { closeModal(); return; }
      close();
    }
  }

  function build() {
    var root = document.createElement('div');
    root.id = 'qdv11'; root.className = 'v11-root'; root.setAttribute('data-theme', V.theme);
    root.setAttribute('role', 'dialog'); root.setAttribute('aria-modal', 'true'); root.setAttribute('aria-label', 'Ombor va moliya');
    root.innerHTML = '<header class="v11-top"><div class="v11-brand"><span class="v11-logo">Q</span><div><b>Qarzim</b><small>Ombor va moliya</small></div></div>' +
      '<div class="v11-top-r"><button type="button" class="v11-ico" data-act="theme" title="Mavzu" aria-label="Mavzuni almashtirish">' + svg(I.moon) + '</button>' +
      '<button type="button" class="v11-btn sm" data-act="refresh" title="Yangilash">' + svg(I.refresh) + '<span class="t">Yangilash</span></button>' +
      '<button type="button" class="v11-btn sm" data-act="close" aria-label="Yopish">' + svg(I.x) + '<span>Yopish</span></button></div></header>' +
      '<div class="v11-body"><nav class="v11-nav" id="v11Nav" aria-label="Bo‘limlar"></nav><main class="v11-main" id="v11Main" tabindex="-1"></main></div>' +
      '<div id="v11Modal" role="dialog" aria-modal="true"></div><div id="v11Tip" class="v11-tip"></div><div id="v11Toast"></div>';
    root.addEventListener('click', onClick);
    root.addEventListener('submit', onSubmit);
    root.addEventListener('change', onChange);
    root.addEventListener('input', onInput);
    root.addEventListener('mouseover', onOver);
    root.addEventListener('mouseout', onOut);
    root.addEventListener('mousemove', function (e) { tipMove(e); });
    root.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.closest && e.target.closest('[data-nav]')) { e.preventDefault(); go(e.target.dataset.nav); } onKey(e); });
    return root;
  }
  function open() {
    if (!V.root) { V.root = build(); document.body.appendChild(V.root); }
    V.root.style.display = 'flex'; V.open = true;
    V.root.querySelector('#v11Main').focus && V.root.querySelector('#v11Main').focus();
    V.loadErr = '';
    if (offline()) { render(); return; }
    loadAll();
  }
  function close() { if (V.root) V.root.style.display = 'none'; V.open = false; if (V.root) closeModal(); }

  window.QDV11 = { open: open, close: close, isOpen: function () { return V.open; } };
  // v10 dagi "Ombor" tugmasi va boshqa joylar uchun
  document.addEventListener('qarzim:open-v11', open);
})();
</script>
</body>
</html>
